<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Bar 1 Gradient (Left) -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Bar 2 Gradient (Center) -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Bar 3 Gradient (Right) -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Arc Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FED7AA" />
      <stop offset="85%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glow for Orange Beacon -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="40%" stop-color="#FB923C" />
      <stop offset="80%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>

    <filter id="beaconHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Bar 1 (Left - Shortest) -->
    <path
      d="M 46 98 C 46 91, 51 86, 58 86 L 72 86 C 79 86, 84 91, 84 98 L 74 138 C 74 142, 70 145, 65 145 L 40 145 C 36 145, 33 141, 35 137 Z"
      fill="url(#bar1Grad)"
    />

    <!-- Bar 2 (Center - Tallest) -->
    <path
      d="M 94 62 C 94 54, 100 48, 108 48 L 126 48 C 134 48, 140 54, 140 62 L 122 138 C 122 142, 118 145, 113 145 L 86 145 C 82 145, 79 141, 81 137 Z"
      fill="url(#bar2Grad)"
    />

    <!-- Bar 3 (Right - Medium) -->
    <path
      d="M 148 76 C 148 69, 153 64, 160 64 L 176 64 C 183 64, 188 69, 188 76 L 168 138 C 168 142, 164 145, 159 145 L 136 145 C 132 145, 129 141, 131 137 Z"
      fill="url(#bar3Grad)"
    />

    <!-- Bar Highlights (Glossy 3D top reflection) -->
    <path d="M 50 94 C 50 89, 54 88, 60 88 L 70 88 C 76 88, 79 90, 78 95 L 75 106 L 47 106 Z" fill="#FFFFFF" fill-opacity="0.22" />
    <path d="M 98 58 C 98 52, 103 50, 110 50 L 124 50 C 131 50, 134 53, 133 59 L 130 72 L 95 72 Z" fill="#FFFFFF" fill-opacity="0.25" />
    <path d="M 152 72 C 152 66, 157 65, 163 65 L 173 65 C 179 65, 182 67, 181 73 L 178 84 L 149 84 Z" fill="#FFFFFF" fill-opacity="0.22" />

    <!-- Swoosh Arc Cut Through -->
    <path
      d="M 32 131 C 68 126, 120 114, 180 72"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
      stroke-opacity="0.9"
    />
    <path
      d="M 32 131 C 68 126, 120 114, 180 72"
      stroke="url(#swooshGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Orange Beacon Glow Halo -->
    <circle cx="182" cy="71" r="14" fill="#F97316" fill-opacity="0.35" filter="url(#beaconHalo)" />

    <!-- Orange Beacon Sphere -->
    <circle cx="182" cy="71" r="8" fill="url(#beaconGlow)" />
    <circle cx="180" cy="69" r="2.5" fill="#FFFFFF" fill-opacity="0.8" />
  </g>
</svg>
